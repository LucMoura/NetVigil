[package]
name = "netvigil"
version = "0.1.0"
edition = "2024"
description = "Network intelligence and reconnaissance CLI"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ipnet = "2.12.2"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }
